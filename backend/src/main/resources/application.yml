server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/contacts;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none          # Liquibase owns the schema, not Hibernate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: true           # http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/contacts)

app:
  cors:
    allowed-origins: http://localhost:4200
