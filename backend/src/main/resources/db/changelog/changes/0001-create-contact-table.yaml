databaseChangeLog:
  - changeSet:
      id: 0001-create-contact-table
      author: contacts-lab
      changes:
        - createTable:
            tableName: contact
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: varchar(20)
              - column:
                  name: company
                  type: varchar(80)
              - column:
                  name: favorite
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: contact
