<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <button class="btn btn-primary btn-sm" (click)="newContact()">New</button>
      <button
        class="btn btn-outline-secondary btn-sm"
        [disabled]="!hasSelection()"
        (click)="editSelected()"
      >
        Edit
      </button>
      <button class="btn btn-outline-danger btn-sm" [disabled]="!hasSelection()" (click)="remove()">
        Delete
      </button>
      <button class="btn btn-outline-secondary btn-sm" (click)="reload()">Refresh</button>
      <input
        class="form-control form-control-sm ms-auto"
        style="max-width: 240px"
        placeholder="Quick filter…"
        [(ngModel)]="quickFilter"
      />
    </div>

    @if (error()) {
      <div class="alert alert-warning py-2">{{ error() }}</div>
    }

    <ag-grid-angular
      class="ag-theme-quartz"
      style="width: 100%; height: 420px"
      [rowData]="rows()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [quickFilterText]="quickFilter"
      rowSelection="single"
      (gridReady)="onGridReady($event)"
      (selectionChanged)="onSelectionChanged($event)"
    />

    @if (editing(); as contact) {
      <div class="border rounded p-3 mt-3 bg-light">
        <h2 class="h6">
          {{ isNew() ? 'New contact' : 'Edit ' + contact.firstName + ' ' + contact.lastName }}
        </h2>
        <form [formGroup]="form" (ngSubmit)="save()">
          <formly-form [form]="form" [fields]="fields" [(model)]="model" />
          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary btn-sm">Save</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancel()">
              Cancel
            </button>
          </div>
        </form>
      </div>
    }
  </div>
</div>
